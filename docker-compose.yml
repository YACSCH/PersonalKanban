services:
  db:
    image: postgres:17-alpine
    container_name: kanban-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kanban}
      POSTGRES_USER: ${POSTGRES_USER:-kanban}
      # Sin valores por defecto: define ambos en .env (ignorado por git).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      KANBAN_APP_PASSWORD: ${KANBAN_APP_PASSWORD:?Define KANBAN_APP_PASSWORD en .env}
    ports:
      # Solo loopback: la base no queda accesible desde la red local.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - kanban_pgdata:/var/lib/postgresql/data
      # En un volumen nuevo, crea el rol de aplicación sin superusuario.
      - ./scripts/db-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kanban_pgdata:
